server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/shopease_auth
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  # Set JWT_SECRET in every environment except local development (at least 32 characters)
  secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
  access-token-ttl: 15m
  refresh-token-ttl: 7d

auth:
  lockout:
    max-attempts: 5
    duration: 15m

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
